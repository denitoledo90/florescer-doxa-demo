# Leia-me do pastor — fundamentação e adaptação

> **Resumo:** esta é uma demonstração educativa inspirada em conceitos de DISC e CliftonStrengths, não uma aplicação oficial, diagnóstico psicológico ou instrumento validado. Os resultados são hipóteses para conversa, não decisões automáticas.

## 1. Para que serve a demonstração

O Florescer apresenta uma maneira de conversar com voluntários sobre como preferem contribuir, o que lhes dá energia e como está sua disponibilidade para servir. A proposta combina cuidado, reflexão e diálogo pastoral, sem reduzir uma pessoa a um rótulo.

Os documentos de origem são “Bot de Liderança Doxa — o roteiro” e “EmpatIA × Doxa — cuidar e liderar”, fornecidos para este projeto. Eles propõem duas lentes e seis papéis de equipe. A implementação acrescenta regras e exemplos necessários para demonstrar o fluxo; esses acréscimos ainda precisam de revisão.

## 2. A primeira lente: DISC

O trabalho de William Moulton Marston, publicado em 1928, propôs uma teoria sobre expressões comportamentais que inspirou instrumentos desenvolvidos posteriormente. As versões modernas de DISC variam conforme o fornecedor; os nomes atuais não são necessariamente idênticos aos termos originais de Marston. As referências ao final explicam essa evolução.

De modo geral, a linguagem contemporânea descreve quatro tendências. Os nomes abaixo são aproximações educativas, não uma descrição completa dos instrumentos comerciais:

| Letra | Tendência usada no protótipo | Exemplo de contribuição |
| --- | --- | --- |
| D | Dominância: iniciativa, decisão e foco em resultados | Definir prioridades diante de um imprevisto |
| I | Influência: comunicação, entusiasmo e mobilização | Aproximar e encorajar pessoas |
| S | Estabilidade: cooperação, apoio e constância | Sustentar acordos e oferecer apoio |
| C | Conformidade ou cautela: análise, precisão e qualidade | Examinar detalhes antes de agir |

Essas tendências não definem o valor, o caráter, a fé ou a capacidade de alguém. Uma pessoa pode apresentar comportamentos diferentes conforme o contexto. A demonstração não aplica nem substitui um questionário DISC oficial e não utiliza a pontuação ou os relatórios proprietários de fornecedores.

## 3. A segunda lente: Gallup e CliftonStrengths

O trabalho de Don Clifton e da Gallup propõe desenvolver pessoas a partir de seus talentos. Na abordagem CliftonStrengths, talentos são padrões recorrentes que podem ser desenvolvidos por meio de prática, conhecimento e habilidades. O instrumento oficial da Gallup identifica e organiza 34 temas de talento; os quatro domínios são uma forma de agrupar temas para refletir sobre colaboração.

| Domínio | Ideia geral, em nossas palavras |
| --- | --- |
| Execução | Transformar planos em ações e entregas |
| Influência | Comunicar ideias e mobilizar pessoas |
| Relacionamento | Construir vínculos e apoiar a colaboração |
| Pensamento estratégico | Analisar informações e considerar possibilidades futuras |

No protótipo, chamamos o último domínio de “Estratégico”. As perguntas de energia foram criadas para uma conversa sobre preferências de contribuição; elas não medem os 34 temas, não identificam talentos CliftonStrengths e não produzem um resultado oficial da Gallup. A associação entre uma tarefa e um domínio é uma escolha editorial da demonstração, não uma conclusão estabelecida sobre a pessoa.

## 4. Como adaptamos as duas lentes

A adaptação tenta observar **uma escolha de comportamento** e **uma preferência de atividade** por semana. São sinais limitados para dialogar, não medidas definitivas de personalidade ou talento.

- A caminhada contém oito episódios. Cada episódio tem um dilema de estilo e uma pergunta de energia, cada um com quatro alternativas.
- Em cada dilema de estilo, as alternativas recebem, nessa ordem, as etiquetas D, I, S e C. A escolha soma um ponto à etiqueta correspondente.
- Em cada pergunta de energia, as alternativas recebem, nessa ordem, as etiquetas Influência, Relacionamento, Execução e Estratégico. A escolha soma um ponto à etiqueta correspondente.
- O primeiro par de perguntas foi apresentado nos documentos de origem. Os outros sete pares são propostas escritas para este protótipo e ainda não foram validados.
- A pergunta sobre valores é registrada, mas não soma pontos ao estilo nem à energia. A reflexão em texto e o compromisso são registrados; seu conteúdo não é analisado pela pontuação.
- Em cada semana, o pastor pode escrever sua pergunta ou pedir uma sugestão opcional à IA com base no tema informado e nas duas perguntas fixas. A sugestão deve ser revisada e não muda os dilemas ou a pontuação.
- O retorno do compromisso não altera os pontos de estilo ou energia, mas entra no indicador demonstrativo de confiança descrito adiante.

As opções são contextuais e simplificadas. Alguém pode gostar de uma atividade por motivos diferentes da etiqueta atribuída. A semelhança de nomes não torna essas perguntas equivalentes às avaliações oficiais.

## 5. Como o papel demonstrativo é calculado

Antes de quatro episódios não é atribuído papel. A partir de quatro, o estilo só é considerado predominante se a categoria mais escolhida tiver pelo menos dois pontos de vantagem sobre a segunda. Para energia, exige-se uma categoria com maior contagem, exceto na regra específica de Formador.

| Papel de equipe | Estilo predominante | Energia observada na demonstração |
| --- | --- | --- |
| Arquiteto | D ou C | Estratégico como maior contagem única |
| Mobilizador | I | Influência como maior contagem única |
| Sustentador | S | Relacionamento como maior contagem única |
| Executor | D | Execução como maior contagem única |
| Guardião | C | Execução como maior contagem única |
| Formador | I ou S | Relacionamento e Estratégico empatados em primeiro, ambos acima dos outros dois |

Os seis nomes vêm da proposta Doxa; não são categorias oficiais de DISC ou de CliftonStrengths. A regra de empate para Formador foi definida para esta demonstração porque a proposta original não especificava todos os critérios de empate.

Sem vantagem suficiente no estilo, com empate de energia fora dessa exceção, ou quando a combinação não está na tabela, o resultado é **perfil misto**. Isso não significa ausência de talentos. A vantagem de dois pontos é uma regra editorial do protótipo, não um corte psicométrico validado.

## 6. Marcos, confiança e carga

As devolutivas são exibidas após quatro e oito episódios. Entre o quinto e o sétimo, o relatório continua usando os primeiros quatro; ao chegar ao oitavo, usa os oito. O indicador de carga considera os check-ins de liderança mais recentes, mesmo entre os marcos.

No cálculo demonstrativo, a confiança é “média” com quatro ou cinco respostas. De seis a oito respostas, ela passa a “alta” somente quando mais de 75% dos compromissos com retorno registrado foram marcados “Sim”; caso contrário, permanece “média”. “Em parte” e “Não” entram no denominador, e retornos ainda não registrados ficam fora dele. Assim, 3 de 4 é exatamente 75% e não atende ao corte; 4 de 5 é 80% e atende ao corte se também houver pelo menos seis episódios.

O painel apresenta apenas os marcos de quatro e oito episódios. Essa “confiança” é um indicador operacional criado para o roteiro, não uma probabilidade de acerto, medida estatística nem garantia de validade.

Para carga, se pelo menos dois dos últimos três check-ins nominais disponíveis da liderança forem “Cansado” ou “Sobrecarregado”, o painel mostra **“Não aumentar”**. Se não houver esse sinal, mostra que é necessário conversar antes de alterar a carga; isso não autoriza assumir mais tarefas. O check-in da liderança é diferente do cuidado privado da EmpatIA.

## 7. Exemplo fictício: Ana

Na amostra inicial, Ana escolheu S em três dos quatro dilemas de estilo e C em um. Nas perguntas de energia, escolheu Relacionamento três vezes e Execução uma vez. A diferença entre os estilos é de dois pontos, e Relacionamento é a maior contagem única; pela tabela demonstrativa, aparece o papel **Sustentadora**.

Os três últimos check-ins nominais da amostra inicial indicam cansaço ou sobrecarga, então a carga aparece como **“Não aumentar”**. Três compromissos têm retorno “Sim” e o quarto está pendente; esses dados mudam quando a demonstração é utilizada.

O painel exemplifica “Infantil, na preparação de sala” como um texto fixo associado a esse papel. Não é uma indicação individual verificada: o protótipo não compara disponibilidade, competências, necessidades reais ou política de proteção. Qualquer trabalho com menores exige avaliação humana e salvaguardas próprias.

## 8. O que o pastor deve e não deve concluir

- Use a devolutiva para perguntar à pessoa se ela se reconhece nas observações, ouvir seu contexto e combinar próximos passos possíveis.
- Consulte as contagens que sustentam uma frase; “3 de 4 escolhas” descreve respostas, não prova uma característica permanente.
- Não use este protótipo para diagnosticar saúde, atribuir dons definitivos, contratar, promover, excluir alguém ou substituir uma avaliação profissional.
- Não aumente carga automaticamente, nem interprete um papel sugerido como autorização para trabalhar com crianças ou adolescentes.
- Os textos de devolutiva e de ministério são modelos fixos selecionados por regras. A IA opcional sugere apenas a pergunta semanal do pastor; não analisa respostas, sentimentos ou áudios e não recomenda papéis ou ministérios.

## 9. Privacidade e funcionamento atual

O fluxo proposto começa na EmpatIA e usa um código para liberar a conversa de liderança. Apenas a conclusão deve atravessar essa ponte, nunca as conversas ou respostas privadas de cuidado. No HTML atual, a EmpatIA e o código são simulações locais; não existe integração real ou controle de acesso.

O check-in da liderança é nominal e pode aparecer na visão do pastor. A escolha feita no espaço de cuidado desta demonstração fica apenas na memória da tela e é descartada ao sair ou concluir. O gráfico de cuidado do pastor é uma amostra estática e fictícia, independente das respostas individuais.

O exemplo oculta blocos com menos de cinco participantes. Esse limite, por si só, **não garante anonimato**: uma solução real precisa avaliar células pequenas, combinações de filtros e risco de reidentificação.

Cadastro, respostas de liderança e conteúdo semanal do pastor ficam no armazenamento local do navegador, sem criptografia ou autenticação. O arquivo aberto diretamente e o servidor local usam armazenamentos separados; dados e rascunhos não passam automaticamente entre eles. **Use apenas dados fictícios.** A LGPD trata dados relacionados a convicção religiosa e saúde como sensíveis em determinadas circunstâncias; antes de uso real, é necessária revisão jurídica, base legal adequada, transparência, segurança e mecanismos para os direitos dos titulares.

Para levar a configuração entre os dois endereços, use **Baixar semanas** e depois **Importar semanas** em Episódios. O arquivo inclui títulos, links, conteúdos e perguntas do pastor, inclusive alterações ainda não salvas, mas não inclui cadastro, respostas, check-ins ou escolhas de cuidado. Após importar, revise e salve; guarde ou apague o arquivo baixado conforme necessário.

## 10. Antes de um piloto real

- Revisar perguntas e linguagem com a Doxa e profissionais qualificados, preservando a dignidade e a autonomia das pessoas.
- Definir o propósito, avaliar vieses, confiabilidade e validade no público e contexto de uso, e documentar limitações.
- Se houver comparação com instrumentos oficiais, obter acesso legítimo e consentimento, definir o protocolo com especialistas e não tratar uma pequena amostra como prova de validade.
- O objetivo preliminar de concordância em 7 de 10 participantes citado no material de origem é uma proposta inicial de piloto, não um resultado observado nem evidência suficiente de validade.
- Implementar autenticação, permissões, armazenamento seguro, retenção e exclusão, avaliação da LGPD e uma política de proteção de crianças e adolescentes.

## 11. Sugestões semanais com IA

Em **Demo pastor → Episódios**, abra uma semana e escreva o tema ou um resumo da mensagem no campo de conteúdo. Os dois dilemas fixos aparecem logo acima. Depois de conectar o Azure OpenAI, o botão **Gerar sugestão com IA** envia o número da semana, o título, esse conteúdo e os dois enunciados ao serviço. Não são enviados automaticamente cadastro, respostas, check-ins ou cuidado privado; não inclua esses dados no conteúdo digitado.

A IA propõe uma pergunta e explica sua relação editorial com os dilemas. Ela pode errar ou produzir uma pergunta que induza respostas: revise, escolha **Usar esta pergunta**, edite o campo se desejar e depois salve os episódios. A pergunta não soma pontos e não substitui os itens de estilo e energia. Episódios já iniciados mantêm a pergunta capturada ao começar.

Abrir o HTML diretamente permite editar as perguntas, mas não conecta a IA. Para gerar, use o servidor local incluído no pacote. Ele não grava a chave em arquivo ou no navegador; ela permanece na memória do processo enquanto ele estiver aberto. O conteúdo enviado ao Azure fica sujeito às configurações e políticas do recurso utilizado.

## 12. Como verificar e conectar o Azure

- Acesse [Microsoft Foundry](https://ai.azure.com/) e procure um projeto ou recurso Azure OpenAI e um modelo já implantado. Caso não veja nenhum, consulte o administrador da assinatura; acesso ao portal, permissões e cobrança dependem da organização.
- Para esta demonstração, você precisa do endpoint HTTPS do recurso Azure OpenAI, do nome da implantação de um modelo compatível com Chat Completions e modo JSON e de uma chave de API. O endpoint deve ser o do recurso, não o endereço de um projeto. Não compartilhe a chave nesta conversa.
- Extraia o pacote e abra **FlorescerServidor.exe**. Na janela local, informe endpoint, implantação e chave; a chave não é exibida. Pressione Enter no primeiro campo para iniciar sem IA. O navegador abrirá o endereço local mostrado na janela.
- Em Episódios, informe um tema fictício, gere e revise a sugestão. Cada chamada pode gerar custos no recurso Azure. Se o servidor indicar erro de autenticação ou implantação, confirme os dados com o administrador.
- Esta ponte local aceita chave de API, não autenticação Microsoft Entra ID. Se a organização desabilita chaves, é necessário implementar outra forma de autenticação aprovada; não altere a política da organização para usar esta demo.
- O servidor escuta apenas neste computador, mas não possui autenticação de usuários e não é adequado para produção. Feche a janela do servidor ao terminar.

    function respondInChat(promptId,value){
      const q=currentChatPrompt();
      if(q.id!==promptId){chatError("A pergunta mudou. Responda à mensagem mais recente.");return;}
      let answer=value;
      if(q.kind==="choice"||q.kind==="multi"){
        const indexes=q.kind==="multi"?value:[value];
        if(!Array.isArray(indexes)||!indexes.length||indexes.some(x=>!Number.isInteger(x)||x<0||x>=q.options.length)||new Set(indexes).size!==indexes.length){chatError("Selecione uma opção válida.");return;}
        answer=q.kind==="multi"?indexes.map(i=>q.options[i]):q.numeric?value:q.options[value];
        if(q.field==="ministries"&&answer.includes("Ainda não sirvo")&&answer.length>1){chatError("Escolha os ministérios ou apenas “Ainda não sirvo”.");return;}
      }else if(q.kind==="text"){
        answer=String(value).trim();
        if((!answer&&!q.optional)||answer.length>q.max){chatError(`Escreva uma resposta de até ${q.max} caracteres antes de enviar.`);return;}
      }else{chatError("Use os botões disponíveis para continuar.");return;}
      if(q.id==="bridge"){
        if(!bridgeCode||answer.toUpperCase()!==bridgeCode){chatError("Código inválido ou já utilizado. Conclua uma nova pausa para gerar outro.");return;}
        bridgeCode="";bridgeUsed=true;
      }else if(q.group==="register"){
        registrationDraft[q.field]=q.field==="consent"?true:answer;
        if(registrationStep<REGISTRATION.length-1)registrationStep++;
        else{
          state.profile={...registrationDraft};state.registered=true;save();registrationDraft={};registrationStep=0;
        }
      }else if(q.group==="episode"){
        draft[q.field]=q.field==="video"?true:answer;
        if(step<6)step++;

          state.answers.push({week:state.answers.length+1,mood:draft.mood,reflection:draft.reflection,style:draft.style,energy:draft.energy,value:draft.value,commitment:draft.commitment,episode:draft.episode||volunteerEpisode(state.episodes[state.answers.length]),day:state.clock,followup:null});
          save();draft={};step=0;followupDraft={};
        }
      }else if(q.group==="followup"){
        const pending=followupPending();
        if(!pending||state.clock<pending.day+7){chatError("O retorno ainda não está disponível.");return;}
        if(q.kind==="choice")followupDraft={week:pending.week,result:answer};
        else{
          if(followupDraft.week!==pending.week||!followupDraft.result){chatError("Escolha primeiro como foi seu compromisso.");return;}
          pending.followup={result:followupDraft.result,text:answer,day:state.clock};followupDraft={};save();

      refreshChat();

    function analyze(answers){

      answers.forEach(a=>{style[STYLE[a.style]]++;energy[ENERGY[a.energy]]++;});

      const talent=ee[0][1]>ee[1][1]?ee[0][0]:null;
      let role="Misto";
      if(dominant){
        if(["C","D"].includes(dominant)&&talent==="Estratégico")role="Arquiteto";
        else if(dominant==="I"&&talent==="Influência")role="Mobilizador";
        else if(dominant==="S"&&talent==="Relacionamento")role="Sustentador";
        else if(dominant==="D"&&talent==="Execução")role="Executor";
        else if(dominant==="C"&&talent==="Execução")role="Guardião";
        else if(["I","S"].includes(dominant)&&energy.Relacionamento>0&&energy.Estratégico>0&&energy.Relacionamento===energy.Estratégico&&energy.Relacionamento>energy.Influência&&energy.Relacionamento>energy.Execução)role="Formador";
      }
      const follows=answers.filter(a=>a.followup),kept=follows.filter(a=>a.followup.result==="Sim").length;
      const rate=follows.length?kept/follows.length:0;
      const confidence=!enough?"Indisponível":answers.length>=6&&rate>.75?"Alta":"Média";
      const tired=answers.slice(-3).filter(a=>a.mood>=3).length;
      return {enough,style,energy,dominant,talent,role,confidence,kept,followups:follows.length,rate,tired,load:tired>=2?"Não aumentar":"Conversar antes de alterar"};
    }

    function normalizeEpisodes(items){
      if(!Array.isArray(items)||items.length!==8)return {error:"O arquivo deve conter exatamente oito semanas."};
      const episodes=[];
      for(let i=0;i<items.length;i++){

          (ep.context!==undefined&&typeof ep.context!=="string"))return {error:`A semana ${i+1} tem campos inválidos.`,index:i};

    async function stageEpisodeImport(file){
      if(!file)return;

      if(route!=="episodes"){toast("Volte a Episódios para importar as semanas.");return;}
      if(!parsed||parsed.format!=="florescer-episodios"||parsed.version!==1){episodeError("Este arquivo não é uma configuração de semanas do Florescer.");return;}

      if(result.status==="stale")return `<div class="notice" role="status">O tema ou o título mudou. Gere uma nova sugestão para esse conteúdo.</div>`;

    async function refreshAiStatus(){

        const result=await response.json();
        if(typeof result.configured!=="boolean")throw new Error("Resposta inválida");
        if(status.isConnected)status.textContent=result.configured?"Configuração carregada no servidor; a conexão será verificada ao gerar.":"Servidor aberto sem configuração de IA. Reinicie-o e informe endpoint, implantação e chave.";
      }catch(error){

    function aiError(code,status){
      const messages={
        AI_NOT_CONFIGURED:"O Azure OpenAI ainda não foi configurado no servidor. Reinicie o servidor e informe endpoint, implantação e chave.",

        AZURE_UNAVAILABLE:"O serviço Azure está temporariamente indisponível.",

        MODEL_INVALID_RESPONSE:"O modelo não retornou uma sugestão no formato esperado. Tente novamente.",
        MODEL_INCOMPLETE:"A resposta do modelo veio incompleta. Tente novamente.",
        MODEL_REFUSED:"O modelo não pôde gerar uma sugestão para esse conteúdo.",
        SERVER_ERROR:"O servidor local encontrou um erro. Confira a janela do servidor."

    async function generateReflection(i){
      if(!Number.isInteger(i)||i<0||i>=DILEMMAS.length)return;

      }
      if(!hasLocalAiServer()){

      }
      const request={status:"loading",signature:episodeSignature(episode)};
      aiGeneration[i]=request;paintAiResult(i);
      try{
        const response=await fetch("/api/gerar",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({week:i+1,title,topic,styleDilemma:DILEMMAS[i].s,energyDilemma:DILEMMAS[i].e})});
        let result;
        try{result=await response.json();}catch(error){throw new Error("O servidor retornou uma resposta inválida.");}
        if(!result||typeof result!=="object"||Array.isArray(result))throw new Error("O servidor retornou uma resposta inválida.");
        if(!response.ok)throw new Error(aiError(result.error,response.status));
        if(!result||typeof result.precisa_contexto!=="boolean"||typeof result.fundamentacao!=="string"||!result.fundamentacao.trim()||result.fundamentacao.length>700||
          (!result.precisa_contexto&&(typeof result.pergunta!=="string"||result.pergunta.trim().length<5||result.pergunta.length>350)))throw new Error("O servidor retornou uma sugestão incompleta.");
        if(aiGeneration[i]!==request)return;
        const current=(episodeDraft||state.episodes)[i];
        if(episodeSignature({...current,context:current.context||""})!==request.signature){request.status="stale";return;}
        if(result.precisa_contexto){request.status="error";request.message=`A IA precisa de mais contexto: ${result.fundamentacao.trim()}`;return;}
        request.status="ready";request.question=result.pergunta.trim();request.explanation=result.fundamentacao.trim();

          paintAiResult(i);
          if(route!=="episodes")toast(`A geração da semana ${i+1} terminou. Volte a Episódios para conferir.`);
        }
      }
    }

      <button class="button light" id="generate-${i}" type="button" data-action="generate-reflection" data-week="${i}" ${aiGeneration[i]&&aiGeneration[i].status==="loading"?"disabled":""}>${icon("spark")} Gerar sugestão com IA</button>

      <label for="reflection-${i}">Pergunta de reflexão que aparecerá na conversa simulada</label><textarea id="reflection-${i}" name="reflection-${i}" maxlength="350" required>${esc(ep.reflection)}</textarea><p class="field-note">Escreva ou edite livremente. “Usar esta pergunta” preenche o campo; “Salvar episódios” aplica a configuração.</p></details>`).join("")}
      <p id="form-error" class="error" role="alert"></p><div class="form-actions"><span class="muted small">Salvo apenas neste navegador. Nenhuma mensagem é enviada automaticamente.</span><button class="button">Salvar episódios ${icon("check")}</button></div></form></section>`;
    }
    const readmeMarkdown=document.getElementById("pastor-readme").textContent.replace(/^\n/,"");
    function readmeInline(text){
      return esc(text)
        .replace(/\[([^\]]+)\]\((https:\/\/[^\s)]+)\)/g,'<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>')
        .replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>");
    }
    function renderReadme(markdown){
      const lines=markdown.split(/\r?\n/),out=[];
      let i=0,section=0;
      while(i<lines.length){
        const line=lines[i].trim();
        if(!line||line.startsWith("# ")){i++;continue;}
        if(line.startsWith("## ")){
          out.push(`<h2 id="readme-section-${++section}">${readmeInline(line.slice(3))}</h2>`);i++;continue;
        }
        if(line.startsWith("> ")){
          out.push(`<blockquote><p>${readmeInline(line.slice(2))}</p></blockquote>`);i++;continue;
        }
        if(line.startsWith("|")&&i+1<lines.length&&/^\|\s*:?-/.test(lines[i+1].trim())){
          const cells=row=>row.trim().slice(1,-1).split("|").map(cell=>readmeInline(cell.trim()));
          const headings=cells(line);i+=2;
          const rows=[];
          while(i<lines.length&&lines[i].trim().startsWith("|")){rows.push(cells(lines[i++]));}
          out.push(`<div class="table-wrap" role="region" aria-label="Tabela de referência" tabindex="0"><table><thead><tr>${headings.map(cell=>`<th scope="col">${cell}</th>`).join("")}</tr></thead><tbody>${rows.map(row=>`<tr>${row.map(cell=>`<td>${cell}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`);continue;
        }
        if(line.startsWith("- ")){
          const items=[];
          while(i<lines.length&&lines[i].trim().startsWith("- "))items.push(`<li>${readmeInline(lines[i++].trim().slice(2))}</li>`);
          out.push(`<ul>${items.join("")}</ul>`);continue;
        }
        const paragraph=[];
        while(i<lines.length&&lines[i].trim()&&!/^(#{1,2} |> |- |\|)/.test(lines[i].trim()))paragraph.push(lines[i++].trim());
        if(paragraph.length)out.push(`<p>${readmeInline(paragraph.join(" "))}</p>`);
        else{out.push(`<p>${readmeInline(line)}</p>`);i++;}
      }
      return out.join("");
    }
    function readmeView(){
      const titles=Array.from(readmeMarkdown.matchAll(/^## (.+)$/gm),match=>match[1]);
      const links=titles.map((title,i)=>`<a href="#readme-section-${i+1}">${esc(title)}</a>`).join("");
      return header("Leia-me do pastor","Bases de DISC e CliftonStrengths, adaptação e limites da demonstração.",`<button class="button" data-action="download-readme">${icon("download")} Baixar README</button>`)+`
      <div class="method-layout"><aside class="card method-toc method-toc-desktop"><h2>Neste documento</h2><nav aria-label="Seções do Leia-me">${links}</nav></aside><details class="card method-toc method-toc-mobile"><summary>Navegar por seções</summary><nav aria-label="Seções do Leia-me">${links}</nav></details><article class="card method-body">${renderReadme(readmeMarkdown)}</article></div>`;
    }
    function showModal(title,body,actions=""){
      modal.innerHTML=`<h2 id="modal-title">${title}</h2>${body}<div class="modal-close">${actions}<button class="button light" data-action="close-modal">Fechar</button></div>`;
      modal.showModal();
    }
    function toast(text){const el=document.getElementById("toast");el.textContent=text;clearTimeout(toast.timer);toast.timer=setTimeout(()=>el.textContent="",4500);}
    function showError(text){const el=document.getElementById("form-error");if(el){el.textContent=text;el.scrollIntoView({block:"nearest"});}}
    function download(name,text,type="text/plain;charset=utf-8",bom=true){
      const url=URL.createObjectURL(new Blob([bom?"\ufeff":"",text],{type}));
      const link=document.createElement("a");link.href=url;link.download=name;document.body.append(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);
    }
    function personalText(){
      const n=state.answers.length>=8?8:4,a=analyze(state.answers.slice(0,n)),r=ROLES[a.role];
      return `FLORESCER · EMPATIA × DOXA\nDevolutiva demonstrativa de Ana · ${n} episódios\nDados fictícios. Texto selecionado por regras, sem IA. Não é avaliação psicológica.\n\n${r.quote}\n\n${r.text}\n\nPara continuar crescendo\n${r.practice}\n\n${a.kept} de ${a.followups} compromissos acompanhados foram cumpridos.\n\nVocê é mais do que um perfil. Leve suas percepções para uma conversa.\n`;
    }
    function pastoralReport(){
      const n=state.answers.length>=8?8:4,a=analyze(state.answers.slice(0,n));
      if(!a.enough){showModal("Ainda é cedo para um perfil",`<p>Ana concluiu ${state.answers.length} de 4 episódios necessários para a primeira devolutiva. Não há papel, alocação ou confiança atribuídos.</p>`);return;}
      const r=ROLES[a.role],recent=state.answers.slice(-3),tired=recent.filter(x=>x.mood>=3).length;
      const load=tired>=2?"Não aumentar":"Conversar antes de alterar";
      showModal("Ana · evidências para uma conversa",`<div class="notice purple">Dados fictícios · marco de ${n} episódios · confiança ${a.confidence.toLowerCase()}. Pontuação por regra; texto sem IA.</div>
      <h3>Onde · hipótese para conversar</h3><p>${r.where}. ${r.how}</p><h3>Como · papel na equipe</h3><p>${a.role==="Misto"?"Perfil misto":a.role}. ${r.quote}</p><h3>Carga atual · ${load.toLowerCase()}</h3><p>${tired} dos ${recent.length} últimos check-ins da liderança indicam cansaço ou sobrecarga. São check-ins nominais, não dados da EmpatIA.</p>
      <div class="notice">Nenhuma indicação autoriza aumento de carga ou atuação com menores. A decisão é pastoral e depende de conversa, disponibilidade e política de proteção. A localização sugerida é um exemplo editorial, não um mapeamento validado.</div>
      <h3>Contagem de estilo</h3>${bars(STYLE.map(x=>[STYLE_LABELS[x],a.style[x]]),n)}<h3 class="space">Contagem de energia</h3>${bars(Object.entries(a.energy),n)}<p>Compromissos: ${a.kept} de ${a.followups} acompanhados cumpridos (${Math.round(a.rate*100)}%). ${!a.dominant?"Não há vantagem de 2 pontos entre os dois estilos mais frequentes.":""}</p><p>Consentimento da amostra: ${state.profile.consent?"aceito para dados fictícios":"não registrado"}. Ministérios e disponibilidade são contexto de conversa, não autorização automática.</p>`);
    }
    document.addEventListener("click",event=>{
      const nav=event.target.closest("[data-nav]");if(nav){navigate(nav.dataset.nav);return;}
      const target=event.target.closest("[data-action]");if(!target)return;
      switch(target.dataset.action){
        case "close-modal":pendingEpisodeImport=null;modal.close();break;
        case "start-episode":if(state.registered&&state.answers.length<8&&!followupPending()&&!draft.active){draft={active:true,episode:volunteerEpisode(state.episodes[state.answers.length])};step=0;refreshChat();}break;
        case "chat-answer":respondInChat(target.dataset.prompt,Number(target.dataset.value));break;
        case "chat-skip":if(currentChatPrompt().optional)respondInChat(target.dataset.prompt,"");break;
        case "chat-options":openChatOptions(target.dataset.prompt);break;
        case "chat-back":{
          const q=currentChatPrompt();
          if(!q.back)break;
          if(q.group==="episode")step--;

          refreshChat();break;
        }
        case "chat-history":{
          const thread=document.getElementById("chat-thread"),oldHeight=thread.scrollHeight,oldTop=thread.scrollTop,expanding=!showAllHistory;
          showAllHistory=expanding;render();
          requestAnimationFrame(()=>{const updated=document.getElementById("chat-thread");updated.scrollTop=expanding?oldTop+updated.scrollHeight-oldHeight:0;});break;
        }
        case "chat-progress":{const s=stats();showModal("Sua caminhada, passo a passo",`<p>${s.answered} de 8 episódios concluídos. ${s.kept} de ${s.completed} compromissos acompanhados foram cumpridos.</p>${weeks()}<p>As devolutivas aparecem após os episódios 4 e 8. O retorno de cada compromisso é liberado depois de 7 dias no relógio simulado.</p>`);break;}
        case "chat-info":showModal("Uma conversa demonstrativa",`<p>Esta interface é inspirada no WhatsApp, mas não está conectada a ele. Não há envio real, criptografia de ponta a ponta ou atendimento por IA.</p><p>As respostas seguem um roteiro fixo. Perguntas com mais de três alternativas abrem uma lista. Ministérios e horários permitem seleção múltipla nesta demo web.</p><p>Seu cadastro é salvo ao concluir. As respostas de cada episódio são salvas junto com o compromisso; o retorno, após o texto final. Rascunhos só ficam nesta aba e se perdem ao recarregar.</p><p>Os check-ins de liderança são nominais. As escolhas privadas da EmpatIA nunca são copiadas para esta conversa.</p><p>O histórico é reconstruído a partir das respostas da demonstração, não de mensagens recebidas no WhatsApp. Não há gravação de áudio, transcrição ou envio de anexos.</p>`,draft.active?'<button class="button danger" data-action="exit-episode">Descartar episódio em andamento</button>':"");break;
        case "exit-episode":showModal("Sair deste episódio?",`<p>As respostas deste episódio ainda não foram salvas. Ao sair, elas serão descartadas. Os episódios já concluídos permanecem.</p>`,`<button class="button danger" data-action="confirm-exit">Descartar e sair</button>`);break;
        case "confirm-exit":draft={};step=0;chatTexts={};modal.close();refreshChat();break;
        case "advance":if(followupPending()&&state.clock<followupPending().day+7){state.clock+=7;save();refreshChat();toast("Relógio demonstrativo avançado em 7 dias.");}break;
        case "care-back":careMood=null;careStage=0;render();break;
        case "finish-care":{
          const bytes=crypto.getRandomValues(new Uint8Array(6)),alphabet="ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
          bridgeCode=Array.from(bytes,b=>alphabet[b%alphabet.length]).join("");bridgeUsed=false;careMood=null;careStage=2;render();break;
        }
        case "use-bridge":if(bridgeCode){bridgeCode="";bridgeUsed=true;careStage=0;careMood=null;navigate("journey");toast("Apenas a conclusão da pausa foi confirmada nesta demo.");}break;
        case "pastoral-report":pastoralReport();break;
        case "download-personal":if(state.answers.length>=4)download("minha-devolutiva-demo.txt",personalText());break;
        case "download-readme":download("README-pastor.md",readmeMarkdown,"text/markdown;charset=utf-8",false);break;
        case "open-readme":modal.close();navigate("readme");break;
        case "generate-reflection":generateReflection(Number(target.dataset.week));break;
        case "apply-reflection":applyReflection(Number(target.dataset.week));break;
        case "export-episodes":exportEpisodes();break;
        case "import-episodes":document.getElementById("episode-import").click();break;
        case "confirm-episode-import":
          if(pendingEpisodeImport){episodeDraft=pendingEpisodeImport;pendingEpisodeImport=null;aiGeneration=Array.from({length:8},()=>null);modal.close();render();toast("Semanas carregadas no rascunho. Revise e salve os episódios.");}
          break;
        case "ai-help":showModal("Como conectar a IA do pastor",`<p>1. Acesse <a href="https://ai.azure.com/" target="_blank" rel="noopener noreferrer">Microsoft Foundry</a> e verifique com o administrador se existe um recurso Azure OpenAI com um modelo de Chat Completions implantado. A geração pode ter custo.</p><p>2. Você precisará do <strong>endpoint do recurso</strong>, do <strong>nome da implantação</strong> e de uma <strong>chave de API</strong>. Não envie a chave nesta conversa. Se sua organização não permite chaves, esta demo ainda não oferece autenticação por Microsoft Entra ID.</p><p>3. No pacote do aplicativo, abra <strong>FlorescerServidor.exe</strong> e informe os dados na janela local. A chave não aparece na tela e fica somente na memória do processo. O servidor mostra o endereço para abrir no navegador.</p><p>4. Em Episódios, resuma o tema sem dados pessoais, gere a sugestão e revise antes de usá-la. O modelo pode errar ou produzir uma pergunta inadequada.</p><p><strong>Importante:</strong> o arquivo e o servidor usam armazenamentos separados. Para levar as configurações do pastor, use <strong>Baixar semanas</strong> e <strong>Importar semanas</strong>; a conversa em andamento não é transferida. O servidor é apenas uma ponte de demonstração, sem autenticação; feche sua janela ao terminar.</p><p>Consulte também <a href="https://learn.microsoft.com/pt-br/azure/foundry/openai/api-version-lifecycle" target="_blank" rel="noopener noreferrer">a documentação da Microsoft</a>. A conexão só fica ativa depois da configuração; abrir o HTML sozinho não chama a IA.</p>`);break;
        case "method":showModal("Como a demonstração calcula",`<p>Cada escolha de estilo e energia soma um ponto à etiqueta correspondente. O cálculo não usa IA, diagnóstico nem teste psicológico oficial.</p><ul><li>Nenhum perfil antes de 4 episódios. Devolutivas nos marcos 4 e 8.</li><li>Estilo predominante: vantagem de pelo menos 2 pontos sobre o segundo. Sem vantagem, perfil misto.</li><li>Confiança média com 4–5 episódios; alta com 6–8 e mais de 75% dos compromissos acompanhados cumpridos. Caso contrário, permanece média. “Em parte” não conta como cumprido. Não é uma medida estatística.</li><li>Carga: não aumentar quando 2 dos 3 últimos check-ins nominais indicarem cansaço ou sobrecarga. Nos demais casos, conversar; nunca liberar automaticamente.</li><li>A proposta não define como resolver todos os empates de talento. Nesta demo, empate leva a perfil misto, exceto empate na liderança entre relacionamento e estratégico com estilo de acompanhar ou mobilizar, que ilustra Formador. Esta convenção precisa de validação.</li><li>Sem combinação prevista de estilo e talento, não se força um papel.</li><li>Cuidado agregado só aparece para blocos com pelo menos 5 participantes. Não há cruzamento individual; o limite de cinco, por si só, não garante anonimato.</li></ul>`,`<button class="button" data-action="open-readme">Abrir Leia-me completo</button>`);break;
        case "about":showModal("Sobre o Florescer",`<p>Protótipo local em HTML, CSS e JavaScript, baseado em <em>Bot de Liderança Doxa — o roteiro</em> e <em>EmpatIA × Doxa — cuidar e liderar</em>.</p><p><strong>Conversa do colaborador:</strong> visual inspirado no WhatsApp, mensagens de ida e volta, respostas rápidas, listas de opções, campo de texto e devolutivas na conversa. O cadastro e os 8 episódios seguem o mesmo roteiro. A seleção múltipla de ministérios e horários é uma conveniência da demo web, não uma reprodução exata da API do WhatsApp.</p><p><strong>Funciona nesta demo:</strong> ponte por código de uso único em memória, check-in, reflexão em texto, dilemas, compromisso, retorno após avanço do relógio e devolutivas nos marcos 4 e 8. O painel pastoral e o cuidado privado permanecem separados.</p><p><strong>IA opcional do pastor:</strong> a geração de sugestões semanais exige iniciar o servidor local e configurar um recurso Azure OpenAI. A conversa, a pontuação e as devolutivas continuam baseadas em regras; a IA não recebe respostas de colaboradores automaticamente.</p><p><strong>Não está integrado:</strong> WhatsApp, EmpatIA, autenticação, vídeo fornecido pelo pastor, gravação de áudio, transcrição, banco de dados ou envio agendado. A conversa não é um bate-papo livre com IA.</p><p>O nome Florescer, o visual, os textos de acolhimento e os conteúdos ausentes nos PDFs são propostas para discussão. A amostra começa após 4 episódios. Use “Reiniciar” para experimentar desde o cadastro.</p><p>O HTML funciona offline. Quando configurada, a IA só é chamada ao solicitar uma sugestão; links de vídeo só abrem quando você escolhe acessá-los.</p>`);break;
        case "privacy":showModal("Privacidade nesta demonstração",`<p><strong>Não use dados reais.</strong> Informações religiosas e de cuidado exigem proteção específica. Este arquivo não implementa consentimento jurídico válido para operação real nem controles de acesso.</p><p><strong>Liderança:</strong> cadastro fictício, respostas, check-ins nominais, compromissos, conteúdo do pastor e configuração de episódios são salvos no armazenamento local deste navegador, sem criptografia. Qualquer pessoa com acesso ao arquivo e a este perfil do navegador pode abrir a área do pastor.</p><p><strong>IA do pastor:</strong> ao gerar uma sugestão, são enviados ao Azure o número da semana, o título, o conteúdo informado pelo pastor e os dois dilemas. Respostas dos colaboradores, check-ins e escolhas de cuidado não são enviados automaticamente. Não inclua dados pessoais no conteúdo.</p><p><strong>Cuidado:</strong> a escolha fica só na memória da tela e é descartada ao sair ou concluir. O código em memória registra somente a conclusão da simulação; não contém respostas. O painel agregado usa uma amostra estática independente.</p><p><strong>Excluir:</strong> o botão abaixo apaga os dados deste protótipo neste endereço e limpa o estado em memória. Arquivos baixados e dados do outro endereço (arquivo ou servidor) devem ser apagados separadamente.</p><p>Uma aplicação real precisa de autenticação, separação de bases, controle de permissões, política de retenção e exclusão, revisão LGPD e proteção de menores.</p>`,`<button class="button danger" data-action="delete-data">Apagar dados locais</button>`);break;
        case "reset":showModal("Como deseja reiniciar?",`<p>Apenas os dados desta demonstração serão substituídos. Configurações de episódios e respostas atuais serão removidas.</p>`,`<button class="button light" data-action="reset-sample">Restaurar amostra</button><button class="button" data-action="reset-empty">Começar do zero</button>`);break;
        case "reset-sample":resetState(false);modal.close();navigate("home");toast("Amostra fictícia restaurada.");break;
        case "reset-empty":resetState(true);modal.close();navigate("journey");toast("Demonstração reiniciada. Comece pelo cuidado.");break;
        case "delete-data":showModal("Apagar os dados deste protótipo?",`<p>Esta ação remove respostas, cadastro e configurações salvas neste navegador. Os PDFs originais e outros arquivos não serão alterados.</p>`,`<button class="button danger" data-action="confirm-delete">Confirmar exclusão</button>`);break;
        case "confirm-delete":
          try{localStorage.removeItem(KEY);state=initialState();state.registered=false;state.answers=[];state.profile={ministries:[],availability:[],consent:false};state.clock=0;clearTransientState();storageIssue="";modal.close();navigate("journey");toast("Dados locais apagados. Nenhuma resposta foi mantida.");}
          catch(error){showModal("Não foi possível apagar",`<p>O navegador bloqueou a exclusão. Apague os dados do site nas configurações do navegador. Detalhe: ${esc(error.message)}</p>`);}
          break;
      }
    });
    document.addEventListener("change",event=>{
      if(event.target.id==="care-block")document.getElementById("aggregate").innerHTML=aggregateView(event.target.value);
      if(event.target.id==="episode-import"){
        const file=event.target.files[0];event.target.value="";stageEpisodeImport(file);

      if(event.target.name==="choice"&&currentChatPrompt().field==="ministries"){
        const inputs=Array.from(modal.querySelectorAll('input[name="choice"]')),none=inputs.find(x=>Number(x.value)===MINISTRIES.length);
        if(event.target===none&&event.target.checked)inputs.filter(x=>x!==none).forEach(x=>x.checked=false);
        else if(event.target.checked&&none)none.checked=false;
      }
    });
    document.addEventListener("input",event=>{
      if(event.target.id==="chat-input")chatTexts[event.target.form.dataset.prompt]=event.target.value;
      if(event.target.form&&event.target.form.id==="episodes-form"){
        const match=/^(title|url|reflection|context)-([0-7])$/.exec(event.target.name||"");
        if(match){
          const i=Number(match[2]);ensureEpisodeDraft();episodeDraft[i][match[1]]=event.target.value;
          if((match[1]==="title"||match[1]==="context")&&aiGeneration[i]&&aiGeneration[i].status==="ready"){
            aiGeneration[i].status="stale";paintAiResult(i);
          }
        }
      }
    });
    document.addEventListener("invalid",event=>{
      if(event.target.form&&event.target.form.id==="episodes-form"){
        const week=event.target.closest("details");if(week)week.open=true;
      }
    },true);
    document.addEventListener("keydown",event=>{
      if(event.target.id==="chat-input"&&event.key==="Enter"&&!event.shiftKey&&!event.isComposing){
        event.preventDefault();event.target.form.requestSubmit();
      }
    });
    function clearTransientState(){
      draft={};step=0;careMood=null;careStage=0;bridgeCode="";bridgeUsed=false;
      registrationStep=0;registrationDraft={};followupDraft={};chatTexts={};showAllHistory=false;
      episodeDraft=null;pendingEpisodeImport=null;aiGeneration=Array.from({length:8},()=>null);
    }
    function resetState(empty){
      state=initialState();clearTransientState();
      if(empty){state.registered=false;state.answers=[];state.clock=0;state.profile={ministries:[],availability:[],consent:false};}
      save();
    }
    document.addEventListener("submit",event=>{
      const form=event.target;if(!(form instanceof HTMLFormElement))return;event.preventDefault();
      if(!form.reportValidity())return;
      const data=new FormData(form);
      if(form.id==="chat-compose"){
        respondInChat(form.dataset.prompt,String(data.get("message")||""));
      }else if(form.id==="chat-list-form"){
        const q=currentChatPrompt(),values=data.getAll("choice").map(Number);
        respondInChat(form.dataset.prompt,q.kind==="multi"?values:values[0]);
      }else if(form.id==="care-form"){
        careMood=Number(data.get("careMood"));careStage=1;render();main.focus();
      }else if(form.id==="episodes-form"){
        const values=state.episodes.map((_,i)=>({title:String(data.get(`title-${i}`)||""),url:String(data.get(`url-${i}`)||""),reflection:String(data.get(`reflection-${i}`)||""),context:String(data.get(`context-${i}`)||"")}));
        const result=normalizeEpisodes(values);
        if(result.error){episodeError(result.error,result.index);return;}
        state.answers.forEach(answer=>{if(!answer.episode)answer.episode=volunteerEpisode(state.episodes[answer.week-1]);});
        state.episodes=result.episodes;episodeDraft=null;const persisted=save();if(persisted)toast("Episódios salvos neste navegador.");else toast("Alterações aplicadas apenas em memória. Consulte o aviso.");
      }
    });
    render();
  </script>
